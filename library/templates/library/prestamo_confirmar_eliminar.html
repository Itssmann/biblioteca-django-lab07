{% extends "base.html" %}
{% block content %}
  <h1>Eliminar préstamo</h1><p>¿Confirma la eliminación del préstamo de «{{ prestamo.libro.titulo }}» a «{{ prestamo.lector.nombre }}»?</p>
  <form method="post">{% csrf_token %}<button type="submit">Confirmar eliminación</button></form>
  <p><a href="{% url 'library:listado_prestamos' %}">Cancelar</a></p>
{% endblock %}
